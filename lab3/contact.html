<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Enquiry</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .header h2 {
            color: #102a43;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            color: #627d98;
            font-size: 15px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334e68;
            margin-bottom: 6px;
        }

        label span {
            color: #e12d39;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 14px;
            color: #102a43;
            outline: none;
            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2680c2;
            box-shadow: 0 0 0 3px rgba(38, 128, 194, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            background-color: #0b69a3;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #044e78;
        }

        .success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #c3e6cb;
            margin-top: 15px;
            text-align: center;
        }

        @media (max-width: 550px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Product Enquiry Form</h2>
            <p>
                Interested in our products? Fill out the details below and we will get
                back to you shortly.
            </p>
        </div>

        <form id="enquiryForm" onsubmit="handleSubmit(event)">
            <!-- Full Name & Email -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name <span>*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required />
                </div>
            </div>

            <!-- Phone Number & Company Name -->
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number <span>*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required />
                </div>
                <div class="form-group">
                    <label for="company">Company / Organization</label>
                    <input type="text" id="company" name="company" placeholder="e.g. Acme Corp" />
                </div>
            </div>

            <!-- Product Selection & Quantity -->
            <div class="form-row">
                <div class="form-group">
                    <label for="product">Select Product <span>*</span></label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>-- Choose a Product --</option>
                        <option value="Product A">Enterprise Software Suite</option>
                        <option value="Product B">Hardware Server Unit</option>
                        <option value="Product C">Cloud Storage Plan</option>
                        <option value="Other">Other / Custom Requirement</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Estimated Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="1" placeholder="e.g. 10" />
                </div>
            </div>

            <!-- Detailed Message -->
            <div class="form-group">
                <label for="message">Your Message / Specifications <span>*</span></label>
                <textarea id="message" name="message"
                    placeholder="Please describe your specific requirements, timeline, or any questions..."
                    required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Submit Enquiry</button>
        </form>

        <div id="successMessage" class="success-message">
            Thank you! Your enquiry has been received. Our team will contact you
            within 24 hours.
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Prevents page reload

            // Collect form data (if you want to send it via API later)
            const form = document.getElementById("enquiryForm");
            const successBox = document.getElementById("successMessage");

            // Show confirmation message
            successBox.style.display = "block";

            // Reset form fields
            form.reset();
        }
    </script>
</body>

</html>
